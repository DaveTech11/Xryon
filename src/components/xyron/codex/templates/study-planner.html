<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Planner</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:#fff; font-family:system-ui,sans-serif; padding:24px 14px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { margin:0 0 18px; font-size:1.6rem; } h1 span { color:#ef4444; }
  form { display:flex; flex-wrap:wrap; gap:8px; }
  input, select { background:#111; border:1px solid rgba(255,255,255,.12); color:#fff; border-radius:999px; padding:12px 16px; font-size:.95rem; }
  input[type=text] { flex:1; min-width:160px; }
  button.add { background:#ef4444; border:0; color:#fff; border-radius:999px; padding:12px 22px; font-weight:600; cursor:pointer; }
  ul { list-style:none; padding:0; margin:22px 0 0; }
  li { display:flex; align-items:center; gap:12px; background:#0f0f10; border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:14px 16px; margin-bottom:10px; }
  li.done .t { text-decoration:line-through; color:#777; } li .t { flex:1; } li small { color:#999; display:block; }
  li button { background:none; border:0; color:#888; cursor:pointer; font-size:1.1rem; }
  .stat { color:#999; font-size:.9rem; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Study <span>Planner</span></h1>
  <form id="f">
    <input id="task" type="text" placeholder="What do you need to study?" required>
    <select id="day"><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option></select>
    <button class="add" type="submit">Add</button>
  </form>
  <div class="stat" id="stat"></div>
  <ul id="list"></ul>
</div>
<script>
  // Tasks live in memory only. To keep them after a refresh, save the array with localStorage.
  var tasks = [];
  var list = document.getElementById("list");
  function draw() {
    list.innerHTML = "";
    tasks.forEach(function (t, idx) {
      var li = document.createElement("li"); if (t.done) li.className = "done";
      var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = t.done;
      cb.onchange = function () { t.done = cb.checked; draw(); };
      var box = document.createElement("div"); box.className = "t";
      box.textContent = t.text;
      var s = document.createElement("small"); s.textContent = t.day; box.appendChild(s);
      var del = document.createElement("button"); del.textContent = "✕"; del.setAttribute("aria-label", "Delete task");
      del.onclick = function () { tasks.splice(idx, 1); draw(); };
      li.appendChild(cb); li.appendChild(box); li.appendChild(del); list.appendChild(li);
    });
    var done = tasks.filter(function (t) { return t.done; }).length;
    document.getElementById("stat").textContent = tasks.length ? done + " of " + tasks.length + " done" : "No tasks yet.";
  }
  document.getElementById("f").onsubmit = function (e) {
    e.preventDefault();
    var input = document.getElementById("task");
    tasks.push({ text: input.value.trim(), day: document.getElementById("day").value, done: false });
    input.value = ""; draw();
  };
  draw();
</script>
</body>
</html>
